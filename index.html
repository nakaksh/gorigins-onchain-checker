<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Read a wallet's Gulag and restored Gorigins holdings directly from Gorbagana." />
    <title>Gulag &amp; Gorigins Wallet Checker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Gulag &amp; Gorigins Wallet Checker</h1>
      <p>
        Enter a public Gorbagana wallet address. This page reads its current finalized token accounts directly from
        Gorbagana. It never connects to your wallet and cannot request a signature or transaction.
      </p>

      <form id="checker-form">
        <label for="wallet">Wallet address</label>
        <div class="input-row">
          <input id="wallet" name="wallet" placeholder="Paste a Gorbagana wallet address" autocomplete="off" spellcheck="false" />
          <button id="check-button" type="submit">Check wallet</button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <section id="results" hidden>
        <div class="result-heading">
          <div>
            <h2 id="result-title"></h2>
            <p id="result-wallet" class="mono"></p>
          </div>
          <p id="result-slot" class="slot"></p>
        </div>
        <div class="collection-results">
          <section class="collection-group">
            <h3 id="gulag-title"></h3>
            <ol id="gulag-holdings"></ol>
          </section>
          <section class="collection-group">
            <h3 id="gorigin-title"></h3>
            <ol id="gorigin-holdings"></ol>
          </section>
        </div>
        <button id="download-button" type="button" hidden>Download result JSON</button>
      </section>

    </main>
  </body>
</html>
